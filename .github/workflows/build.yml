name: Build Firmware

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
  # Refresh the GitHub Pages demo when a release is published, so the web
  # flasher's "stable" firmware follows the actually-published release (#108).
  release:
    types: [ published ]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # full:  every optional feature the board's hardware supports (build.py --all-features).
  #        This is the firmware of this project: it carries the plain file names and is what
  #        a release ships, what the web flasher installs and what the frame's OTA update
  #        fetches (esp32-photoframe-<board>.bin).
  # plain: no optional feature, i.e. the upstream firmware - built to prove that it still
  #        compiles and links, uploaded as a workflow artifact only (-plain file names).
  build:
    runs-on: ubuntu-24.04
    needs: ci
    permissions:
      contents: write
    strategy:
      matrix:
        board: [waveshare_photopainter_73, seeedstudio_xiao_ee02, seeedstudio_reterminal_e1002, seeedstudio_xiao_ee04, seeedstudio_reterminal_e1004, seeedstudio_reterminal_e1003, seeedstudio_xiao_ee03, m5stack_m5paper_v11]
        variant: [plain, full]
        include:
          - variant: plain
            feature_args: ''
            suffix: '-plain'
            artifact_prefix: plain-photoframe-firmware-
          - variant: full
            feature_args: '--all-features'
            suffix: ''
            artifact_prefix: photoframe-firmware-
          # bootloader_offset differs by chip family: 0x1000 on the ESP32,
          # 0x0 on the ESP32-S3.
          - board: waveshare_photopainter_73
            flash_size: 16MB
            target: esp32s3
            bootloader_offset: '0x0'
          - board: seeedstudio_xiao_ee02
            flash_size: 16MB
            target: esp32s3
            bootloader_offset: '0x0'
          - board: seeedstudio_reterminal_e1002
            flash_size: 32MB
            target: esp32s3
            bootloader_offset: '0x0'
          - board: seeedstudio_xiao_ee04
            flash_size: 16MB
            target: esp32s3
            bootloader_offset: '0x0'
          - board: seeedstudio_reterminal_e1004
            flash_size: 32MB
            target: esp32s3
            bootloader_offset: '0x0'
          - board: seeedstudio_reterminal_e1003
            flash_size: 32MB
            target: esp32s3
            bootloader_offset: '0x0'
          - board: seeedstudio_xiao_ee03
            flash_size: 16MB
            target: esp32s3
            bootloader_offset: '0x0'
          - board: m5stack_m5paper_v11
            flash_size: 16MB
            target: esp32
            bootloader_offset: '0x1000'
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Extract version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
        else
          VERSION=$(python3 scripts/get_version.py --type dev)
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Building version: ${VERSION}"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Build webapp
      run: python3 build.py --board ${{ matrix.board }} ${{ matrix.feature_args }} --step webapp

    - name: Install splash screen system dependencies
      run: |
        pip install qrcode
        sudo apt-get update && sudo apt-get install -y librsvg2-bin

    - name: Generate splash screen
      run: python3 build.py --board ${{ matrix.board }} --step splash

    # espressif/esp-idf-ci-action pulls its own Docker image and isn't a composite
    # action, so a generic retry wrapper can't cover it - pull the image ourselves
    # first, with retries, so a flaky registry doesn't fail the whole matrix job.
    - name: Pre-pull the ESP-IDF Docker image
      run: |
        for i in 1 2 3; do
          docker pull espressif/idf:release-v6.0 && break
          echo "Pull attempt $i failed, retrying..."
          sleep 10
        done

    # The release feed baked into the firmware: the repository variable OTA_REPO (set in
    # this repository and in its mirror, both to the canonical repository) or, when there
    # is none, this repository itself. A mirror that builds a release therefore still
    # points the frame at the canonical feed.
    - name: Setup ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: release-v6.0
        target: ${{ matrix.target }}
        command: |
          python3 build.py --board ${{ matrix.board }} ${{ matrix.feature_args }} --step firmware \
            --ota-repo ${{ vars.OTA_REPO || github.repository }} \
            -DFIRMWARE_VERSION='${{ steps.version.outputs.version }}'

    - name: Install esptool
      run: pip install esptool

    - name: Prepare & merge firmware artifacts
      run: |
        mkdir -p firmware

        # Create merged firmware directly from build directory
        esptool.py --chip ${{ matrix.target }} merge-bin -o firmware/photoframe-firmware-${{ matrix.board }}${{ matrix.suffix }}-merged.bin \
          --flash_mode dio --flash_freq 80m --flash_size ${{ matrix.flash_size }} \
          ${{ matrix.bootloader_offset }} build/bootloader/bootloader.bin \
          0x8000 build/partition_table/partition-table.bin \
          0x20000 build/esp32-photoframe.bin

        # Copy OTA binary with board name for release
        cp build/esp32-photoframe.bin firmware/esp32-photoframe-${{ matrix.board }}${{ matrix.suffix }}.bin

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_prefix }}${{ matrix.board }}
        path: firmware/
        retention-days: 90

  # Every optional feature on its own (plus nothing and everything) must at least
  # compile; a board only takes the features whose hardware it has. One job per set,
  # each with a fresh build directory.
  feature-compile:
    runs-on: ubuntu-24.04
    needs: ci
    strategy:
      matrix:
        board: [waveshare_photopainter_73, seeedstudio_xiao_ee02]
        feature_set: [off, telegram, overlays, agenda, battery-history, display-history, https, offline-hotspot, error-banner, ota-channel, wifi-resilience, facecrop, webcal, source-auth, caldav, caldav-todo, glyphs, info-screens, chore-wheel, weather-screen, fact-of-the-day, finance-snapshot, fuel-prices, market-quotes, upload-dedup, multi-upload, fixes, all]
        include:
          - board: waveshare_photopainter_73
            feature_set: chimes
          - board: waveshare_photopainter_73
            feature_set: climate
          - board: waveshare_photopainter_73
            feature_set: alarmclock
          - board: waveshare_photopainter_73
            feature_set: voice-stop
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Build the web app of the feature set
      run: python3 scripts/feature_matrix.py --board ${{ matrix.board }} --webapp only ${{ matrix.feature_set }}

    - name: Install splash screen system dependencies
      run: |
        pip install qrcode
        sudo apt-get update && sudo apt-get install -y librsvg2-bin

    - name: Generate splash screen
      run: python3 build.py --board ${{ matrix.board }} --step splash

    - name: Compile the feature set
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: release-v6.0
        target: esp32s3
        command: python3 scripts/feature_matrix.py --board ${{ matrix.board }} --webapp skip ${{ matrix.feature_set }}

  release:
    runs-on: ubuntu-24.04
    needs: [ci, build]
    # A tag push, or a manual run on a tag (`gh workflow run build.yml --ref vX.Y.Z`, the
    # fallback when a push starts no run, see docs/MAINTAINING.md section 9). A
    # release-published event also carries a tag ref, but re-running this job then would
    # draft over the just-published release.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download all firmware artifacts
      uses: actions/download-artifact@v8
      with:
        path: firmware-artifacts
        pattern: photoframe-firmware-*
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        # Pre-release tag convention (docs/MAINTAINING.md section 10): a
        # `-rc<n>` suffix, e.g. v218.0.3-rc1. Still a draft either way - the
        # maintainer confirms (and can override) both the notes and this
        # flag before actually publishing.
        prerelease: ${{ contains(github.ref, '-rc') }}
        files: |
          firmware-artifacts/photoframe-firmware-waveshare_photopainter_73-merged.bin
          firmware-artifacts/esp32-photoframe-waveshare_photopainter_73.bin
          firmware-artifacts/photoframe-firmware-seeedstudio_xiao_ee02-merged.bin
          firmware-artifacts/esp32-photoframe-seeedstudio_xiao_ee02.bin
          firmware-artifacts/photoframe-firmware-seeedstudio_reterminal_e1002-merged.bin
          firmware-artifacts/esp32-photoframe-seeedstudio_reterminal_e1002.bin
          firmware-artifacts/photoframe-firmware-seeedstudio_xiao_ee04-merged.bin
          firmware-artifacts/esp32-photoframe-seeedstudio_xiao_ee04.bin
          firmware-artifacts/photoframe-firmware-seeedstudio_reterminal_e1004-merged.bin
          firmware-artifacts/esp32-photoframe-seeedstudio_reterminal_e1004.bin
          firmware-artifacts/photoframe-firmware-seeedstudio_reterminal_e1003-merged.bin
          firmware-artifacts/esp32-photoframe-seeedstudio_reterminal_e1003.bin
          firmware-artifacts/photoframe-firmware-seeedstudio_xiao_ee03-merged.bin
          firmware-artifacts/esp32-photoframe-seeedstudio_xiao_ee03.bin
          firmware-artifacts/photoframe-firmware-m5stack_m5paper_v11-merged.bin
          firmware-artifacts/esp32-photoframe-m5stack_m5paper_v11.bin
        body: |
          The firmware in this release is the full build: every optional feature the board's
          hardware supports (see docs/FEATURES.md). It updates itself from these releases.

          ## What's New

          ## Improvements

          ## Installation
          ### Web Flasher (Easiest)

          Flash directly from your browser (Chrome/Edge/Opera required):
          **[https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#flash](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)**

          ### Manually
          The merged binary covers the whole flash from offset 0, so writing it also erases the
          device's WiFi credentials and settings (the web flasher above keeps them). To keep them,
          use the frame's own update function instead (it installs `esp32-photoframe-[board].bin`).
          Choose the appropriate merged binary for your board:
          - `photoframe-firmware-waveshare_photopainter_73-merged.bin`: For Waveshare 7.3" 7-color e-paper
          - `photoframe-firmware-seeedstudio_xiao_ee02-merged.bin`: For Seeed XIAO EE02
          - `photoframe-firmware-seeedstudio_reterminal_e1002-merged.bin`: For Seeed reTerminal E1002
          - `photoframe-firmware-seeedstudio_xiao_ee04-merged.bin`: For Seeed XIAO EE04
          - `photoframe-firmware-seeedstudio_reterminal_e1004-merged.bin`: For Seeed reTerminal E1004
          - `photoframe-firmware-seeedstudio_reterminal_e1003-merged.bin`: For Seeed reTerminal E1003 (10.3" grayscale)
          - `photoframe-firmware-seeedstudio_xiao_ee03-merged.bin`: For Seeed XIAO EE03 (10.3" grayscale)
          - `photoframe-firmware-m5stack_m5paper_v11-merged.bin`: For M5Stack M5Paper v1.0/v1.1 (4.7" grayscale)

          ```bash
          # ESP32-S3 boards (everything except the M5Paper)
          esptool.py --chip esp32s3 --port /dev/ttyUSB0 --baud 921600 write_flash 0x0 photoframe-firmware-[board]-merged.bin

          # M5Stack M5Paper (ESP32)
          esptool.py --chip esp32 --port /dev/ttyUSB0 --baud 921600 write_flash 0x0 photoframe-firmware-m5stack_m5paper_v11-merged.bin
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    runs-on: ubuntu-24.04
    needs: [ci, build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    permissions:
      # Pages is served from the gh-pages branch; deploying = pushing to it.
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download all firmware artifacts
      uses: actions/download-artifact@v8
      with:
        path: firmware-artifacts
        pattern: photoframe-firmware-*
        merge-multiple: true

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Build demo webapp
      run: |
        cd webapp
        npm ci
        npm run build:demo

    - name: Copy firmware and generate manifests
      run: |
        # Create demo directory if it doesn't exist
        mkdir -p demo

        # Copy static assets for the demo landing page
        cp .img/sample.jpg demo/
        cp .img/taipei101.jpg demo/
        cp .img/stock_algorithm.bmp demo/
        cp .img/our_algorithm.png demo/
        cp .img/feature_graphic.png demo/
        cp webapp/public/icon.svg demo/

        # Generate the dithered hero preview from taipei101.jpg
        node webapp/node_modules/@aitjcize/epaper-image-convert/src/cli.js \
          -d 800x480 -f png -p balanced \
          --orientation landscape --scale-mode cover \
          --use-perceived-output --dither-algorithm stucki \
          .img/taipei101.jpg demo/taipei101_dithered.png

        # Determine the stable version and, separately, a pre-release version
        # (docs/MAINTAINING.md sections 10 and 16: a `-rc<n>`-suffixed tag).
        # Every deploy rebuilds demo/ from scratch and force-pushes it, so
        # whatever is not restored below vanishes from the site: the stable
        # entry is the latest published non-pre-release release, the
        # pre-release entry the newest published pre-release that is newer
        # than that stable release.
        PRERELEASE_TAG=""
        THIS_TAG=""
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # What decides is the release's own isPrerelease flag (the "Create
          # Release" step above derives it from the same suffix, but the
          # maintainer can override it before publishing). That lookup does
          # not see a DRAFT, and the release job that creates the draft runs
          # in parallel with this job, so on a tag-push run it usually finds
          # nothing yet - only then fall back to the tag convention. The run
          # the "published" event triggers later sees the real flag and
          # corrects the site if the two ever disagree.
          IS_PRERELEASE=$(gh release view "$TAG_NAME" --json isPrerelease -q .isPrerelease 2>/dev/null || echo "")
          if [[ -z "$IS_PRERELEASE" ]]; then
            if [[ "$TAG_NAME" == *-rc* ]]; then IS_PRERELEASE=true; else IS_PRERELEASE=false; fi
          fi
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            # A pre-release tag must not become the new "stable" entry -
            # stable stays whatever the latest actual (non-prerelease,
            # non-draft) release already is.
            PRERELEASE_TAG="$TAG_NAME"
            THIS_TAG="$TAG_NAME"
            STABLE_TAG=$(gh release list --exclude-pre-releases -L 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          else
            STABLE_TAG="$TAG_NAME"
          fi
        else
          # On main branch: check if HEAD has a (stable) tag (e.g., tag and main pushed together)
          HEAD_TAG=$(git tag --points-at HEAD | grep '^v' | grep -v -- '-rc' | head -1)
          if [[ -n "$HEAD_TAG" ]]; then
            STABLE_TAG="$HEAD_TAG"
          else
            # Fall back to latest published release
            STABLE_TAG=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "")
          fi
        fi
        # Not a pre-release tag run: keep offering the newest published pre-release
        # that is newer than the stable release (none once a newer stable one exists).
        if [[ -z "$PRERELEASE_TAG" ]]; then
          STABLE_AT=""
          if [[ -n "$STABLE_TAG" ]]; then
            STABLE_AT=$(gh release view "$STABLE_TAG" --json publishedAt -q .publishedAt 2>/dev/null || echo "")
          fi
          PRERELEASE_TAG=$(gh release list -L 30 --json tagName,isPrerelease,isDraft,publishedAt \
            -q "[.[] | select(.isPrerelease and (.isDraft | not) and .publishedAt > \"${STABLE_AT}\")] | sort_by(.publishedAt) | reverse | .[0].tagName // empty" 2>/dev/null || echo "")
        fi
        echo "Stable version: ${STABLE_TAG:-none}"
        echo "Pre-release version: ${PRERELEASE_TAG:-none}"

        BOARDS="waveshare_photopainter_73 seeedstudio_xiao_ee02 seeedstudio_reterminal_e1002 seeedstudio_xiao_ee04 seeedstudio_reterminal_e1004 seeedstudio_reterminal_e1003 seeedstudio_xiao_ee03 m5stack_m5paper_v11"

        for board in $BOARDS; do
          mkdir -p "demo/$board"

          # Dev firmware from this build (the full build, see the matrix above)
          cp "firmware-artifacts/photoframe-firmware-$board-merged.bin" "demo/$board/photoframe-firmware-$board-dev.bin"

          if [[ -n "$PRERELEASE_TAG" && "$PRERELEASE_TAG" == "$THIS_TAG" ]]; then
            # This tag is a pre-release: stage this run's own build as the
            # pre-release asset (generate_manifests.py --prerelease-version's
            # expected file name), never as stable.
            cp "demo/$board/photoframe-firmware-$board-dev.bin" "demo/$board/photoframe-firmware-$board-prerelease-merged.bin"
          elif [[ -n "$PRERELEASE_TAG" ]]; then
            # An earlier published pre-release that is still the newest one:
            # restore its asset (into a scratch directory - the download keeps
            # the release's own file name, which is the stable one's name too).
            mkdir -p "demo/$board/.pre"
            if gh release download "$PRERELEASE_TAG" --pattern "photoframe-firmware-$board-merged.bin" --dir "demo/$board/.pre" --clobber; then
              mv "demo/$board/.pre/photoframe-firmware-$board-merged.bin" "demo/$board/photoframe-firmware-$board-prerelease-merged.bin"
            else
              echo "::warning::No pre-release asset for $board at ${PRERELEASE_TAG} - omitting the pre-release option for it."
            fi
            rm -rf "demo/$board/.pre"
          fi

          if [[ "${{ github.ref }}" == refs/tags/* ]] && [[ -z "$PRERELEASE_TAG" ]]; then
            # A genuine stable-release tag: use this build as stable.
            cp "demo/$board/photoframe-firmware-$board-dev.bin" "demo/$board/photoframe-firmware-$board-merged.bin"
          elif [[ -n "$STABLE_TAG" ]]; then
            # main branch, or a pre-release tag (which must not overwrite
            # stable with its own build): download the actual latest stable
            # release using gh (authenticated).
            echo "Downloading stable release ${STABLE_TAG} firmware for $board..."
            if gh release download "$STABLE_TAG" --pattern "photoframe-firmware-$board-merged.bin" --dir "demo/$board" --clobber; then
              echo "Successfully downloaded stable firmware ${STABLE_TAG} for $board"
            elif [[ "$board" == "waveshare_photopainter_73" ]] && gh release download "$STABLE_TAG" --pattern "photoframe-firmware-merged.bin" --dir "demo/$board" --clobber; then
              echo "Successfully downloaded legacy stable firmware for $board"
              mv "demo/$board/photoframe-firmware-merged.bin" "demo/$board/photoframe-firmware-$board-merged.bin"
            else
              echo "::warning::No stable release asset for $board at ${STABLE_TAG} (release build may still be uploading). Omitting the stable option — NOT falling back to the dev build."
              rm -f "demo/$board/photoframe-firmware-$board-merged.bin"
            fi
          else
            echo "::warning::No published release found; omitting the stable option for $board — NOT falling back to the dev build."
            rm -f "demo/$board/photoframe-firmware-$board-merged.bin"
          fi

          # Manifests for this board (pass stable version to match the firmware). The merged
          # images are cut into their parts (bootloader, partition table, OTA data, app), so
          # that flashing them leaves the device's WiFi credentials and settings alone.
          python3 scripts/generate_manifests.py --no-copy --dev --demo-dir "demo/$board" --board "$board" \
            ${STABLE_TAG:+--stable-version "$STABLE_TAG"} \
            ${PRERELEASE_TAG:+--prerelease-version "$PRERELEASE_TAG"}
        done

        # Link a default manifest at the root of demo for backward compatibility or default view
        # (the stable manifest may be absent if no release asset was available)
        [ -f demo/waveshare_photopainter_73/manifest.json ] && cp demo/waveshare_photopainter_73/manifest.json demo/
        cp demo/waveshare_photopainter_73/manifest-dev.json demo/

        # The demo package (docs/DEMO_PACKAGE.md): its two importable configs point at
        # <site>/examples/<board>/calendars/*.ics and .../todo.txt, so the whole tree is
        # served from here (next to, not inside, the per-board firmware directories).
        mkdir -p demo/examples
        cp -r examples/. demo/examples/
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Deploy to GitHub Pages (gh-pages branch)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Pages is served from the gh-pages branch ("deploy from a branch").
        # Each deploy force-pushes a fresh single-commit history. Workflow-based
        # Pages deployments are keyed to the workflow's commit SHA and Pages
        # silently drops a deployment whose SHA is already live — which broke
        # every release: the tag points at the commit main just deployed, so
        # the tag run's refreshed stable manifests never went live (#108).
        # A branch push always creates a new commit, so it always deploys.
        touch demo/.nojekyll
        cd demo
        git init -b gh-pages
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -q -m "Deploy demo site from ${GITHUB_SHA} (${GITHUB_REF_NAME}, run ${GITHUB_RUN_ID})"
        git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

    # The demo package's example configs (examples/*/demo-config-*.json) point at files served
    # by this very site; a frame that imports one only finds out about a missing file from a
    # 404 in its own log. Pages needs a moment after the push above, so retry for a few minutes.
    # Only this repository's own site is checked (a fork's configs still point at the original
    # site, which says nothing about the fork's own deploy).
    - name: Check the published demo package URLs
      run: |
        SITE_PREFIX="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
        URLS=$(python3 - "$SITE_PREFIX" <<'PY'
        import glob, json, sys
        prefix = sys.argv[1]
        urls = set()
        for path in glob.glob("examples/*/demo-config-*.json"):
            with open(path, encoding="utf-8") as f:
                for key, value in json.load(f).get("config", {}).items():
                    if "_url" in key and isinstance(value, str) and value.startswith(prefix):
                        urls.add(value)
        print("\n".join(sorted(urls)))
        PY
        )
        URLS=$(echo "$URLS" | tr -d '\r')
        if [[ -z "$URLS" ]]; then
          echo "No example URL points at this site ($SITE_PREFIX) - nothing to check."
          exit 0
        fi
        echo "Checking $(echo "$URLS" | wc -l) URL(s) the example configs point at..."
        for attempt in $(seq 1 30); do
          BAD=""
          for url in $URLS; do
            # A throw-away query string keeps a cached 404 from an earlier request out of the way.
            code=$(curl -s -o /dev/null -w "%{http_code}" "${url}?check=${GITHUB_RUN_ID}-${attempt}" || true)
            [[ "$code" == "200" ]] || BAD="$BAD ${url#$SITE_PREFIX}=$code"
          done
          if [[ -z "$BAD" ]]; then
            echo "All example URLs answer 200 (attempt $attempt)."
            exit 0
          fi
          echo "Attempt $attempt: not yet:$BAD"
          sleep 10
        done
        echo "::error::Example URLs still not served after 5 minutes:$BAD"
        exit 1
