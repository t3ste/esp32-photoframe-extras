name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_call:

jobs:
  format-check:
    name: Code Formatting Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install formatting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
          pip install black isort

      - name: Install webapp dependencies
        run: |
          cd webapp
          npm ci

      - name: Install process-cli dependencies
        run: |
          cd process-cli
          npm ci

      - name: Check code formatting
        run: make format-check

  host-tests:
    name: Host-Based Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          # Install canvas dependencies for image processing tests
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
          # libpng for the host build of the image pipeline
          sudo apt-get install -y libpng-dev

      - name: Run host tests
        run: make test

  feature-tooling:
    name: Feature Flag Tooling
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # the upstream baseline is a fixed upstream commit in the history
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Feature registry tests
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Check board capability and feature tables
        run: python scripts/check_capabilities.py

      - name: Static cross-reference check of the feature guards
        run: python scripts/migrate/xref.py

      - name: With every feature off the sources are the upstream sources
        run: python scripts/migrate/alloff_source.py

      - name: With every feature off the web sources are the upstream web sources
        run: python scripts/migrate/alloff_web.py
